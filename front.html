<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo - Pagina Principal</title>
</head>
<body>
  
    <main class="page-content">
        <ul class="menu">
            <li><a class="dashboard">Dashboard</a></li>
            <li><a class="produtos">Produtos</a></li>
            <li><a class="clientes">Clientes</a></li>
            <li><a class="relatorios">Relatórios</a></li>
        </ul>

        <h1 style="justify-content: center; align-items: center; display: flex;">Área do Administrador</h1>
        
        <section id="clientes" style="display: none;">
            <form action="" method="get">
                <fieldset>
                    <legend>Cadastrar cliente</legend>

                    <p>
                        <label for="nome-cliente">Nome do cliente</label><br>
                        <input type="text" id="nome-cliente" name="nome-cliente" required>
                    </p>

                    <p>
                        <label for="email-cliente">E-mail do cliente</label><br>
                        <input type="email" id="email-cliente" name="email-cliente" required>
                    </p>

                    <button type="submit">Cadastrar cliente</button>
                </fieldset>
            </form>
        </section>

        <p>
            <a href="https://www.gov.br/anvisa/pt-br" target="_blank" rel="noopener noreferrer">Consultar ANVISA</a>
        </p>

    </main>

   <!-- <script src="script/script.js"></script> -->
    <script src="script/main.js"></script>
</body>
</html>
