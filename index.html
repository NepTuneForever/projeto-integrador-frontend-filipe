<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo - Gestão de Atendimento para Farmácias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/main.css">
</head>
<body>

        <div class="intro-overlay" id="intro-overlay">
            <div class="honeycomb">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="intro-wordmark" id="intro-wordmark">
                <div class="loader">
                    <svg height="0" width="0" viewBox="0 0 64 64" class="absolute">
                        <defs>
                            <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="b">
                                <stop stop-color="#973BED"></stop>
                                <stop stop-color="#007CFF" offset="1"></stop>
                            </linearGradient>
                            <linearGradient gradientUnits="userSpaceOnUse" y2="0" x2="0" y1="64" x1="0" id="c">
                                <stop stop-color="#FFC800"></stop>
                                <stop stop-color="#F0F" offset="1"></stop>
                                <animateTransform repeatCount="indefinite" keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1" keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1" dur="8s" values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32" type="rotate" attributeName="gradientTransform"></animateTransform>
                            </linearGradient>
                            <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="d">
                                <stop stop-color="#00E0ED"></stop>
                                <stop stop-color="#00DA72" offset="1"></stop>
                            </linearGradient>
                        </defs>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#b)" d="M 56,4 H 12 V 60 H 56 M 12,32 H 46" class="dash" pathLength="360"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#d)" d="M 12,4 V 60 H 56" class="dash" pathLength="360"></path>
                    </svg>
                    <div class="w-2"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" style="--rotation-duration:0ms; --rotation-direction:normal;" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="10" stroke="url(#c)" d="M 32 32
                            m 0 -27
                            a 27 27 0 1 1 0 54
                            a 27 27 0 1 1 0 -54" class="spin" pathLength="360"></path>
                    </svg>
                </div>
            </div>
        </div>

    <header id="header">
        <h1>ELO</h1>
        <p>Gestão de atendimento ao cliente</p>
    </header>

    <main>
        <section id="cadastro">
            <h2>Login</h2>
            <form action="" method="POST">
                <div id="form-email">
                    <div class="wave-group">
                        <input required type="email" class="input" id="email" name="email" placeholder=" ">
                        <span class="bar"></span>
                        <label class="label" for="email">
                            <span class="label-char" style="--index: 0">E</span>
                            <span class="label-char" style="--index: 1">m</span>
                            <span class="label-char" style="--index: 2">a</span>
                            <span class="label-char" style="--index: 3">i</span>
                            <span class="label-char" style="--index: 4">l</span>
                        </label>
                    </div>
                </div>

                <div id="form-password">
                    <div class="wave-group">
                        <input required type="password" class="input" id="password" name="password" placeholder=" ">
                        <span class="bar"></span>
                        <label class="label" for="password">
                            <span class="label-char" style="--index: 0">S</span>
                            <span class="label-char" style="--index: 1">e</span>
                            <span class="label-char" style="--index: 2">n</span>
                            <span class="label-char" style="--index: 3">h</span>
                            <span class="label-char" style="--index: 4">a</span>
                        </label>
                    </div>
                </div>

                <div class="form-login-button">
                    <button type="submit" id="form-login-button">Login</button>
                </div>

                <div id="form-footer">
                    <p>Não consegue acessar a conta? <span><a href="main.html">Mude sua Senha.</a></span></p>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <img src="assets/images/footer.svg" alt="imagem do footer do projeto">
        <p id="footer-text">Projeto Integrador &mdash; Elo</p>
    </footer>

    <script src="script/script.js"></script>
</body>
</html>
